<section class="comunidade">
  <div class="header-section">
    <h1>Comunidade</h1>
  </div>

  <!-- ABAS -->
  <div class="tabs-comunidade">
    <button class="tab-btn" [class.active]="abaAtiva === 'feed'" (click)="trocarAba('feed')">
        Feed
    </button>
    <button class="tab-btn" [class.active]="abaAtiva === 'social'" (click)="trocarAba('social')">
        Social
    </button>
  </div>

  <!-- CONTEÚDO -->
  <app-feed *ngIf="abaAtiva === 'feed'"></app-feed>
  <app-social *ngIf="abaAtiva === 'social'"></app-social>
</section>
