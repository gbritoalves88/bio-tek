<!-- src/app/features/login/login.component.html -->

<section class="login">
  <div class="login-container">
    <!-- Logo -->
    <div class="logo-area">
      <svg class="logo-grande" viewBox="0 0 120 120" fill="none">
        <path d="M20 102A10 10 0 0 1 30 92H80V8H30A10 10 0 0 0 20 18v84z"
              stroke="currentColor" stroke-width="3" fill="none"/>
      </svg>
      <h1 class="app-nome">Bio-Tek</h1>
      <p class="slogan">Sua jornada literária começa aqui.</p>
    </div>

    <!-- Botões de login -->
    <div class="botoes-login">
      <button class="btn-social btn-google" (click)="entrarComGoogle()">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Entrar com Google
      </button>

      <button class="btn-social btn-facebook" (click)="entrarComFacebook()">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
        </svg>
        Entrar com Facebook
      </button>

      <div class="divider"><span>ou</span></div>

      <button class="btn-convidado" (click)="entrarComoConvidado()">
        Entrar como convidado
      </button>
    </div>

    <p class="termos">
      Ao entrar, você concorda com nossos<br />
      <a href="#">Termos de Uso</a> e <a href="#">Política de Privacidade</a>
    </p>
  </div>
</section>

<!-- Overlay de carregamento -->
<div class="login-loading" *ngIf="carregando">
  <svg class="logo-animado" viewBox="0 0 120 120" fill="none">
    <path d="M20 102A10 10 0 0 1 30 92H80V8H30A10 10 0 0 0 20 18v84z"
          stroke="currentColor" stroke-width="3" fill="none"/>
  </svg>
  <p>Entrando...</p>
</div>

<!-- Modal de erro -->
<div class="erro-modal-overlay" *ngIf="mostrarModalErro">
  <div class="erro-modal-content">
    <div class="erro-icone">
      <svg viewBox="0 0 24 24" fill="none" stroke="#e74c3c" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="15" y1="9" x2="9" y2="15"/>
        <line x1="9" y1="9" x2="15" y2="15"/>
      </svg>
    </div>
    <p class="erro-mensagem">{{ mensagemErro }}</p>
    <button class="erro-btn-ok" (click)="fecharModalErro()">OK</button>
  </div>
</div>
