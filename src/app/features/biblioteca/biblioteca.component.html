<!-- src/app/features/biblioteca/biblioteca.component.html -->

<section class="catalogo">
  <div class="header-section">
    <h1>Biblioteca</h1>
    <button class="btn-circle" title="Adicionar livro" (click)="abrirModal()">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      <span class="btn-label">Novo</span>
    </button>
  </div>

  <!-- Loading -->
  <div class="loading" *ngIf="carregando">
    <div class="spinner"></div>
    <p>Carregando catálogo...</p>
  </div>

  <!-- Conteúdo carregado -->
  <ng-container *ngIf="!carregando">
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        type="text"
        placeholder="Buscar livro ou autor..."
        [(ngModel)]="termoBusca"
        (input)="filtrarLocal()"
        class="search-input" />
      <button class="btn-clear" *ngIf="termoBusca" (click)="limparBusca()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Grid de livros - 3 colunas -->
    <div class="book-grid">
      <div class="book-card" *ngFor="let livro of livrosFiltrados">
        <img [src]="livro.imagem || 'assets/capas/perfilSemFoto.png'" [alt]="livro.titulo" class="book-cover" />
        <div class="book-info">
          <h3 class="book-title">{{ livro.titulo || 'Sem título' }}</h3>
          <p class="book-author">{{ livro.autor || 'Autor desconhecido' }}</p>
          <p class="book-year" *ngIf="livro.anoPublicacao">📅 {{ livro.anoPublicacao }}</p>
        </div>
        <!-- Botão minimalista - apenas ícone -->
        <button class="btn-add-minimal" (click)="adicionarBiblioteca(livro.id)" [disabled]="adicionando[livro.id]" title="Adicionar à biblioteca">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="empty" *ngIf="livros.length === 0 && !carregando">
      <p>📚 Nenhum livro no catálogo</p>
      <p class="empty-hint">Clique no botão + para adicionar livros</p>
    </div>
  </ng-container>
</section>

<!-- Modal de Adicionar Livro -->
<app-add-book-modal
  *ngIf="modalAberto"
  (fechar)="modalAberto = false"
  (livroAdicionado)="onLivroAdicionado($event)">
</app-add-book-modal>
