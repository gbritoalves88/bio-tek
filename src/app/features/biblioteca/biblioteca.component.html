<!-- src/app/features/biblioteca/biblioteca.component.html -->

<section class="biblioteca">
  <div class="header-section">
    <h1>Biblioteca</h1>
    <button class="btn-circle" title="Adicionar livro" (click)="abrirModal()">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      <span class="btn-label">Novo</span>
    </button>
  </div>

  <div class="search-box">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="text" placeholder="Buscar livro ou autor..." [(ngModel)]="termoBusca" class="search-input" />
  </div>

  <div class="filtros">
    <button class="filtro-btn" [class.active]="filtroStatus === null" (click)="filtroStatus = null">Todos</button>
    <button class="filtro-btn" [class.active]="filtroStatus === 1" (click)="filtroStatus = 1">📕 Quero ler</button>
    <button class="filtro-btn" [class.active]="filtroStatus === 2" (click)="filtroStatus = 2">📖 Lendo</button>
    <button class="filtro-btn" [class.active]="filtroStatus === 3" (click)="filtroStatus = 3">✅ Lidos</button>
    <button class="filtro-btn" [class.active]="filtroAvaliado" (click)="filtroAvaliado = !filtroAvaliado">⭐ Avaliados</button>
    <button class="filtro-btn" [class.active]="filtroRecente" (click)="filtroRecente = !filtroRecente">🕐 Recentes</button>
  </div>

  <div class="book-list">
    <div class="book-item" *ngFor="let livro of livrosFiltrados">
      <img [src]="livro.imagem || 'assets/capas/perfilSemFoto.png'" [alt]="livro.titulo" class="book-cover" />
      <div class="book-info">
        <h3 class="book-title">{{ livro.titulo || 'Sem título' }}</h3>
        <p class="book-author">{{ livro.autor || 'Autor desconhecido' }}</p>
        <span class="book-status" [class]="getStatusClass(livro.status)">{{ getStatusTexto(livro.status) }}</span>
        <span class="book-stars" *ngIf="livro.estrelas">⭐ {{ livro.estrelas }}</span>
      </div>
      <div class="book-actions">
        <button class="btn-icon-action btn-comentario" title="Comentários" *ngIf="livro.estrelas" (click)="abrirComentarios(livro)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </button>
        <button class="btn-icon-action" title="Editar" (click)="abrirEdicao(livro)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="btn-icon-action btn-delete" title="Remover" (click)="deletarLivro(livro.id)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
    </div>
  </div>

  <button class="btn-add-full" (click)="abrirModal()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="12" y1="5" x2="12" y2="19"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
    Adicionar novo livro
  </button>
</section>

<app-add-book-modal *ngIf="modalAberto" (fechar)="modalAberto = false" (livroAdicionado)="onLivroAdicionado($event)"></app-add-book-modal>

<div class="editar-modal-overlay" *ngIf="modalEdicaoAberto" (click)="fecharEdicao()">
  <div class="editar-modal-content" (click)="$event.stopPropagation()">
    <div class="editar-modal-header">
      <h2>Editar Livro</h2>
      <button class="editar-modal-close" (click)="fecharEdicao()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="editar-tab-content" *ngIf="livroEditando">
      <label class="input-label">Título</label>
      <input type="text" [(ngModel)]="livroEditando.titulo" name="edit_titulo">
      <label class="input-label">Autor</label>
      <input type="text" [(ngModel)]="livroEditando.autor" name="edit_autor">
      <label class="input-label">Descrição</label>
      <input type="text" [(ngModel)]="livroEditando.descricao" name="edit_descricao">

      <label class="input-label">Capa do Livro</label>
      <div class="edit-upload-capa">
        <div class="edit-upload-opcoes">
          <button type="button" class="btn-upload" (click)="tirarFotoEdicao()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            <span>Tirar foto</span>
          </button>
          <button type="button" class="btn-upload" (click)="fileInputEdicao.click()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            <span>Galeria</span>
          </button>
        </div>
        <input type="file" #fileInputEdicao hidden (change)="onFileSelectedEdicao($event)" accept="image/*">
        <img *ngIf="livroEditando.imagem" [src]="livroEditando.imagem" class="preview-mini" />
        <span *ngIf="!livroEditando.imagem" class="upload-placeholder">Nenhuma capa</span>
      </div>

      <label class="input-label">Status</label>
      <select [(ngModel)]="livroEditando.status" name="edit_status" class="select-status">
        <option [ngValue]="1">📕 Quero ler</option>
        <option [ngValue]="2">📖 Lendo</option>
        <option [ngValue]="3">✅ Lido</option>
      </select>

      <div *ngIf="livroEditando.status === 3" class="avaliacao-box">
        <label class="input-label">Avaliação</label>
        <select [(ngModel)]="livroEditando.estrelas" name="edit_nota" class="select-status">
          <option [ngValue]="1">⭐ Muito Ruim</option>
          <option [ngValue]="2">⭐⭐ Ruim</option>
          <option [ngValue]="3">⭐⭐⭐ Regular</option>
          <option [ngValue]="4">⭐⭐⭐⭐ Bom</option>
          <option [ngValue]="5">⭐⭐⭐⭐⭐ Excelente</option>
        </select>
      </div>

      <button class="editar-btn-submit" (click)="salvarEdicao()">Salvar alterações</button>
    </div>
  </div>
</div>

<app-comentarios-modal [aberto]="comentariosAberto" [livroId]="livroComentarioId" [livroTitulo]="livroComentarioTitulo" (fechar)="comentariosAberto = false"></app-comentarios-modal>
