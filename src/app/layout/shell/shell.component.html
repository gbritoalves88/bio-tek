<div class="shell">
  <header class="header">
    <div class="header-inner">
      <a routerLink="/inicio" class="logo-link" aria-label="Ir para Home">
        <svg class="logo-full" viewBox="0 0 120 30" fill="none">
          <path d="M4 25.5A2.5 2.5 0 0 1 6.5 23H20V2H6.5A2.5 2.5 0 0 0 4 4.5v21z"
                stroke="currentColor" stroke-width="2" fill="none"/>
          <text x="28" y="22" font-family="'Segoe UI', sans-serif" font-size="18"
                font-weight="700" fill="currentColor">BliTeca</text>
        </svg>
      </a>

      <div class="header-actions">
        <app-notification-bell></app-notification-bell>
        <button class="theme-btn" (click)="toggleTheme()">
          {{ isDarkMode ? '☀️' : '🌙' }}
        </button>
      </div>
    </div>
  </header>

  <div class="main-layout">
    <div class="layout-container">
      <!-- SIDEBAR (apenas desktop) -->
      <aside class="sidebar">
        <nav>
          <a routerLink="/inicio" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="sidebar-link">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            Home
          </a>
          <a routerLink="/inicio/biblioteca" routerLinkActive="active" class="sidebar-link">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
            Biblioteca
          </a>
          <a routerLink="/inicio/comunidade" routerLinkActive="active" class="sidebar-link">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            Comunidade
          </a>
          <a routerLink="/inicio/perfil" routerLinkActive="active" class="sidebar-link">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            Perfil
          </a>

          <div class="sidebar-divider"></div>

          <button (click)="sair()" class="sidebar-link btn-sair-sidebar">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Sair
          </button>

          <!-- BOTÃO ADMIN COM SUBITENS -->
          <ng-container *ngIf="isAdmin">
            <div class="sidebar-divider"></div>

            <button class="sidebar-link admin-toggle"
                    [class.active]="adminExpandido"
                    (click)="adminExpandido = !adminExpandido">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
              Admin
              <svg class="seta" [class.expandido]="adminExpandido" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </button>

            <div class="admin-subitens" [class.expandido]="adminExpandido">
              <a routerLink="/inicio/admin" routerLinkActive="active" class="sidebar-link sub-item" [queryParams]="{ aba: 'dashboard' }">📊 Dashboard</a>
              <a routerLink="/inicio/admin" routerLinkActive="active" class="sidebar-link sub-item" [queryParams]="{ aba: 'comentarios' }">💬 Comentários</a>
              <a routerLink="/inicio/admin" routerLinkActive="active" class="sidebar-link sub-item" [queryParams]="{ aba: 'usuarios' }">👥 Usuários</a>
              <a routerLink="/inicio/admin" routerLinkActive="active" class="sidebar-link sub-item" [queryParams]="{ aba: 'livros' }">📚 Livros</a>
            </div>
          </ng-container>
        </nav>
      </aside>

      <main class="content">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>

  <!-- BOTTOM NAV (apenas mobile) -->
  <nav class="bottom-nav">
    <a routerLink="/inicio" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span>Início</span>
    </a>
    <a routerLink="/inicio/biblioteca" routerLinkActive="active">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
      <span>Biblioteca</span>
    </a>
    <a routerLink="/inicio/comunidade" routerLinkActive="active">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <span>Comunidade</span>
    </a>
    <a routerLink="/inicio/perfil" routerLinkActive="active">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <span>Perfil</span>
    </a>
  </nav>
</div>
