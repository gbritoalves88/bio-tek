<div class="shell">
  <header class="header">
    <div class="header-inner">
      <a routerLink="/inicio" class="logo-link" aria-label="Ir para Home">
        <svg class="logo-full" viewBox="0 0 120 30" fill="none">
          <path d="M4 25.5A2.5 2.5 0 0 1 6.5 23H20V2H6.5A2.5 2.5 0 0 0 4 4.5v21z"
                stroke="currentColor" stroke-width="2" fill="none"/>
          <text x="28" y="22" font-family="'Segoe UI', sans-serif" font-size="18"
                font-weight="700" fill="currentColor">BliTeca</text>
        </svg>
      </a>

      <div class="header-actions">
        <app-notification-bell></app-notification-bell>

        <!-- AVATAR + MENU -->
        <div class="header-avatar-wrapper">
          <button class="header-avatar" (click)="toggleMenuAvatar($event)" aria-label="Menu do usuário">
            <img [src]="avatarUrl" [alt]="nomeUsuario" loading="lazy" decoding="async" />
          </button>

          <!-- Backdrop (fecha ao clicar fora) -->
          <div class="avatar-menu-backdrop" *ngIf="menuAvatarAberto" (click)="fecharMenuAvatar()"></div>

          <!-- Menu dropdown -->
          <div class="avatar-menu" *ngIf="menuAvatarAberto">
            <button class="avatar-menu-item" (click)="abrirEdicaoPerfil()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
              Editar perfil
            </button>

            <button class="avatar-menu-item" (click)="abrirContato()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
              </svg>
              Contato / Sugestões
            </button>

            <button class="avatar-menu-item" (click)="avaliarApp()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
              </svg>
              Avaliar App
            </button>

            <button class="avatar-menu-item" (click)="compartilharApp()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="18" cy="5" r="3"/>
                <circle cx="6" cy="12" r="3"/>
                <circle cx="18" cy="19" r="3"/>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
              </svg>
              Compartilhar App
            </button>

            <div class="avatar-menu-divider"></div>

            <button class="avatar-menu-item tema-toggle" (click)="toggleTheme()">
              <svg *ngIf="!isDarkMode" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1" x2="12" y2="3"/>
                <line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/>
                <line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
              </svg>
              <svg *ngIf="isDarkMode" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
              </svg>
              <span>{{ isDarkMode ? 'Tema escuro' : 'Tema claro' }}</span>
              <span class="toggle-switch" [class.on]="isDarkMode">
                <span class="toggle-knob"></span>
              </span>
            </button>

            <div class="avatar-menu-divider"></div>

            <button class="avatar-menu-item perigo" (click)="confirmarExcluirConta()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 6h18"/>
                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
                <line x1="10" y1="11" x2="10" y2="17"/>
                <line x1="14" y1="11" x2="14" y2="17"/>
              </svg>
              Desativar Conta
            </button>

            <button class="avatar-menu-item sair" (click)="sair()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
              </svg>
              Sair
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="main-layout">
    <div class="layout-container">
      <!-- SIDEBAR (apenas desktop) -->
      <aside class="sidebar">
        <nav>
          <a routerLink="/inicio" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="sidebar-link">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            Home
          </a>
          <a routerLink="/inicio/biblioteca" routerLinkActive="active" class="sidebar-link">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
            Biblioteca
          </a>
          <a routerLink="/inicio/comunidade" routerLinkActive="active" class="sidebar-link">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            Comunidade
          </a>
         <a routerLink="/inicio/perfil" routerLinkActive="active" class="sidebar-link">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect width="8" height="18" x="3" y="3" rx="1"/>
            <path d="M7 3v18"/>
            <path d="M20.4 18.9c.2.5-.1 1.1-.6 1.3l-1.9.7c-.5.2-1.1-.1-1.3-.6L11.1 5.1c-.2-.5.1-1.1.6-1.3l1.9-.7c.5-.2 1.1.1 1.3.6Z"/>
          </svg>
            Estante
          </a>

          <div class="sidebar-divider"></div>

          <button (click)="sair()" class="sidebar-link btn-sair-sidebar">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Sair
          </button>

          <!-- BOTÃO ADMIN COM SUBITENS -->
          <ng-container *ngIf="isAdmin">
            <div class="sidebar-divider"></div>

            <button class="sidebar-link admin-toggle"
                    [class.active]="adminExpandido"
                    (click)="adminExpandido = !adminExpandido">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
              Admin
              <svg class="seta" [class.expandido]="adminExpandido" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </button>

            <div class="admin-subitens" [class.expandido]="adminExpandido">
              <a routerLink="/inicio/admin" routerLinkActive="active" class="sidebar-link sub-item" [queryParams]="{ aba: 'dashboard' }">📊 Dashboard</a>
              <a routerLink="/inicio/admin" routerLinkActive="active" class="sidebar-link sub-item" [queryParams]="{ aba: 'comentarios' }">💬 Comentários</a>
              <a routerLink="/inicio/admin" routerLinkActive="active" class="sidebar-link sub-item" [queryParams]="{ aba: 'usuarios' }">👥 Usuários</a>
              <a routerLink="/inicio/admin" routerLinkActive="active" class="sidebar-link sub-item" [queryParams]="{ aba: 'livros' }">📚 Livros</a>
            </div>
          </ng-container>
        </nav>
      </aside>

      <main class="content">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>

  <!-- BOTTOM NAV (apenas mobile) -->
  <nav class="bottom-nav">
    <a routerLink="/inicio" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span>Início</span>
    </a>
    <a routerLink="/inicio/biblioteca" routerLinkActive="active">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
      <span>Biblioteca</span>
    </a>
    <a routerLink="/inicio/comunidade" routerLinkActive="active">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <span>Comunidade</span>
    </a>
    <a routerLink="/inicio/perfil" routerLinkActive="active">
      <svg class="nav-icon"  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect width="8" height="18" x="3" y="3" rx="1"/>
      <path d="M7 3v18"/>
      <path d="M20.4 18.9c.2.5-.1 1.1-.6 1.3l-1.9.7c-.5.2-1.1-.1-1.3-.6L11.1 5.1c-.2-.5.1-1.1.6-1.3l1.9-.7c.5-.2 1.1.1 1.3.6Z"/>
    </svg>
      <span>Estante</span>
    </a>
  </nav>
  <app-leitor></app-leitor>
</div>
