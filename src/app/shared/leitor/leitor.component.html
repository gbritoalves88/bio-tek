<div class="leitor-overlay"
     *ngIf="aberto"
     [style.background]="temaLeitura === 'dark' ? '#111111' : (temaLeitura === 'sepia' ? '#f4ecd8' : '#ffffff')">

  <!-- HEADER -->
  <header class="leitor-header"
          [style.background]="temaLeitura === 'dark' ? '#1c1c1c' : (temaLeitura === 'sepia' ? '#eaddc4' : '#ffffff')"
          [style.border-bottom]="temaLeitura === 'dark' ? '1px solid #333333' : (temaLeitura === 'sepia' ? '1px solid #d6c5a7' : '1px solid #e0e0e0')">

    <button class="leitor-close" (click)="fechar()"
        [style.color]="temaLeitura === 'dark' ? '#e0e0e0' : '#333333'"
        [style.border-color]="temaLeitura === 'dark' ? '#333333' : (temaLeitura === 'sepia' ? '#d6c5a7' : '#e0e0e0')">
      <svg viewBox="0 0 24 24" fill="none" [attr.stroke]="temaLeitura === 'dark' ? '#e0e0e0' : '#333333'" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
    <div class="leitor-titulo-container">
      <h2 [style.color]="temaLeitura === 'dark' ? '#e0e0e0' : '#333333'">{{ nomeLivroExibicao }}</h2>
    </div>

    <div class="leitor-header-actions">
      <!-- Botão Engrenagem -->
      <button class="leitor-icon-btn" (click)="toggleMenuAa()"
              [style.color]="temaLeitura === 'dark' ? '#e0e0e0' : '#333333'"
              [style.border-color]="temaLeitura === 'dark' ? '#333333' : (temaLeitura === 'sepia' ? '#d6c5a7' : '#e0e0e0')">
        <svg viewBox="0 0 24 24" fill="none" [attr.stroke]="temaLeitura === 'dark' ? '#e0e0e0' : '#333333'" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ÁREA EPUB -->
  <div class="leitor-area"
       #leitorArea
       *ngIf="tipo === 'epub'"
       [style.visibility]="carregandoArquivo ? 'hidden' : 'visible'">
  </div>

  <!-- ÁREA PDF -->
  <div class="leitor-area-pdf"
       *ngIf="tipo === 'pdf'"
       [style.visibility]="carregandoArquivo ? 'hidden' : 'visible'"
       [style.background]="temaLeitura === 'dark' ? '#111111' : '#e5e5e5'">
    <canvas #canvasPdf
            [class.modo-escuro]="temaLeitura === 'dark'"
            [class.modo-sepia]="temaLeitura === 'sepia'">
    </canvas>
  </div>

  <!-- LOADING -->
  <div class="leitor-loading" *ngIf="carregandoArquivo"
       [style.background]="temaLeitura === 'dark' ? '#111111' : (temaLeitura === 'sepia' ? '#f4ecd8' : '#ffffff')">
    <div class="spinner"></div>
    <span [style.color]="temaLeitura === 'dark' ? '#a0a0a0' : '#8c7b6b'">Preparando seu livro...</span>
  </div>

  <!-- PAINEL DE CONFIGURAÇÕES -->
  <div class="painel-aa" *ngIf="menuAaAberto"
       [style.background]="temaLeitura === 'dark' ? '#1c1c1c' : (temaLeitura === 'sepia' ? '#eaddc4' : '#ffffff')">
    <div class="painel-header" [style.border-bottom]="temaLeitura === 'dark' ? '1px solid #333333' : '1px solid #d6c5a7'">
      <span [style.color]="temaLeitura === 'dark' ? '#e0e0e0' : '#333333'">Aparência</span>
      <button (click)="toggleMenuAa()" [style.color]="temaLeitura === 'dark' ? '#e0e0e0' : '#333333'">✕</button>
    </div>

    <div class="painel-conteudo">
      <!-- Temas -->
      <div class="controle-grupo">
        <label [style.color]="temaLeitura === 'dark' ? '#a0a0a0' : '#8c7b6b'">Tema</label>
        <div class="botoes-tema">

          <!-- 🆕 Botão Claro SÓ para PDF -->
          <button *ngIf="tipo === 'pdf'"
                  [class.ativo]="temaLeitura === 'light'"
                  (click)="mudarTema('light')"
                  [style.color]="temaLeitura === 'dark' ? '#e0e0e0' : '#333333'"
                  [style.border-color]="temaLeitura === 'dark' ? '#333333' : '#e0e0e0'">
            Claro
          </button>

          <button [class.ativo]="temaLeitura === 'sepia'" (click)="mudarTema('sepia')"
                  [style.color]="temaLeitura === 'dark' ? '#e0e0e0' : '#333333'"
                  [style.border-color]="temaLeitura === 'dark' ? '#333333' : '#d6c5a7'">
            Sépia
          </button>

          <button [class.ativo]="temaLeitura === 'dark'" (click)="mudarTema('dark')"
                  [style.color]="temaLeitura === 'dark' ? '#e0e0e0' : '#333333'"
                  [style.border-color]="temaLeitura === 'dark' ? '#333333' : '#d6c5a7'">
            Escuro
          </button>
        </div>
      </div>

      <!-- Configurações EPUB -->
      <div class="controle-grupo" *ngIf="tipo === 'epub'">
        <label [style.color]="temaLeitura === 'dark' ? '#a0a0a0' : '#8c7b6b'">Tamanho da fonte</label>
        <div class="botoes-fonte" [style.background]="temaLeitura === 'dark' ? '#222222' : (temaLeitura === 'sepia' ? '#f4ecd8' : '#f5f5f5')">
          <button (click)="diminuirFonte()" [style.background]="temaLeitura === 'dark' ? '#333333' : '#ffffff'" [style.color]="temaLeitura === 'dark' ? '#e0e0e0' : '#333333'">A-</button>
          <span [style.color]="temaLeitura === 'dark' ? '#e0e0e0' : '#333333'">{{ tamanhoFonte }}%</span>
          <button (click)="aumentarFonte()" [style.background]="temaLeitura === 'dark' ? '#333333' : '#ffffff'" [style.color]="temaLeitura === 'dark' ? '#e0e0e0' : '#333333'">A+</button>
        </div>
      </div>

      <!-- Configurações PDF -->
      <div class="controle-grupo" *ngIf="tipo === 'pdf'">
        <label [style.color]="temaLeitura === 'dark' ? '#a0a0a0' : '#8c7b6b'">Visualização</label>
        <div class="botoes-tema">
          <button (click)="ajustarLargura()"
                  [class.ativo]="ajusteLarguraPdf"
                  [style.color]="temaLeitura === 'dark' ? '#e0e0e0' : '#333333'"
                  [style.border-color]="temaLeitura === 'dark' ? '#333333' : '#e0e0e0'">
            Ajustar Largura
          </button>
        </div>

        <label [style.color]="temaLeitura === 'dark' ? '#a0a0a0' : '#8c7b6b'" style="margin-top: 12px; display: block;">Zoom</label>
        <div class="botoes-fonte" [style.background]="temaLeitura === 'dark' ? '#222222' : (temaLeitura === 'sepia' ? '#f4ecd8' : '#f5f5f5')">
          <button (click)="zoomOut()" [style.background]="temaLeitura === 'dark' ? '#333333' : '#ffffff'" [style.color]="temaLeitura === 'dark' ? '#e0e0e0' : '#333333'">-</button>
          <span [style.color]="temaLeitura === 'dark' ? '#e0e0e0' : '#333333'">{{ (zoom * 100) | number:'1.0-0' }}%</span>
          <button (click)="zoomIn()" [style.background]="temaLeitura === 'dark' ? '#333333' : '#ffffff'" [style.color]="temaLeitura === 'dark' ? '#e0e0e0' : '#333333'">+</button>
        </div>
      </div>
    </div>
  </div>

  <!-- FOOTER FIXO -->
  <footer class="leitor-footer"
          [style.background]="temaLeitura === 'dark' ? '#1c1c1c' : (temaLeitura === 'sepia' ? '#eaddc4' : '#ffffff')"
          [style.border-top]="temaLeitura === 'dark' ? '1px solid #333333' : (temaLeitura === 'sepia' ? '1px solid #d6c5a7' : '1px solid #e0e0e0')">
    <div class="footer-top">
      <button class="pdf-nav" (click)="tipo === 'pdf' ? pdfAnterior() : anterior()"
              [style.color]="temaLeitura === 'dark' ? '#e0e0e0' : '#333333'"
              [style.border-color]="temaLeitura === 'dark' ? '#333333' : (temaLeitura === 'sepia' ? '#d6c5a7' : '#e0e0e0')">
        <svg viewBox="0 0 24 24" fill="none" [attr.stroke]="temaLeitura === 'dark' ? '#e0e0e0' : '#333333'" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>

      <div class="pagina-info" *ngIf="tipo === 'pdf'">
        <span [style.color]="temaLeitura === 'dark' ? '#e0e0e0' : '#333333'">{{ pdfPaginaAtual }}</span>
        <span [style.color]="temaLeitura === 'dark' ? '#e0e0e0' : '#333333'">de {{ pdfTotalPaginas }}</span>
        <span class="porcentagem" [style.color]="'var(--accent)'"> - {{ progresso }}%</span>
      </div>
      <div class="pagina-info" *ngIf="tipo === 'epub'">
        <span class="porcentagem" [style.color]="'var(--accent)'">{{ progresso }}% concluído</span>
      </div>

      <button class="pdf-nav" (click)="tipo === 'pdf' ? pdfProxima() : proxima()"
              [style.color]="temaLeitura === 'dark' ? '#e0e0e0' : '#333333'"
              [style.border-color]="temaLeitura === 'dark' ? '#333333' : (temaLeitura === 'sepia' ? '#d6c5a7' : '#e0e0e0')">
        <svg viewBox="0 0 24 24" fill="none" [attr.stroke]="temaLeitura === 'dark' ? '#e0e0e0' : '#333333'" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

    <div class="progresso-wrapper">
      <input
        type="range"
        class="progresso-slider"
        [min]="1"
        [max]="tipo === 'pdf' ? pdfTotalPaginas : 100"
        [value]="tipo === 'pdf' ? pdfPaginaAtual : progresso"
        (input)="onSliderChange($event)"
      />
    </div>
  </footer>
</div>
