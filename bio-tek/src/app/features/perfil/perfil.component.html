<section class="perfil">
  <div class="perfil-header">
    <img [src]="usuario.avatar" [alt]="usuario.nome" class="avatar" />
    <h1 class="nome">{{ usuario.nome }}</h1>
    <p class="bio">{{ usuario.bio }}</p>
  </div>

  <div class="stats">
    <div class="stat-item">
      <span class="stat-valor">{{ usuario.livrosLidos }}</span>
      <span class="stat-label">Livros lidos</span>
    </div>
    <div class="stat-item">
      <span class="stat-valor">{{ usuario.horasLidas }}</span>
      <span class="stat-label">Horas lidas</span>
    </div>
    <div class="stat-item">
      <span class="stat-valor">⭐ {{ usuario.avaliacaoMedia }}</span>
      <span class="stat-label">Avaliação média</span>
    </div>
  </div>

  <button class="btn-editar">Editar perfil</button>
  <button class="btn-sair" (click)="sair()">Sair</button>
</section>
