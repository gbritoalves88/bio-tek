<section class="biblioteca">
  <div class="header-section">
    <h1>Biblioteca</h1>
      <button class="btn-circle" title="Adicionar livro">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        <span class="btn-label">Novo</span>
      </button>
  </div>

  <!-- Campo de busca -->
  <div class="search-box">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input
      type="text"
      placeholder="Buscar livro ou autor..."
      [(ngModel)]="termoBusca"
      class="search-input"
    />
  </div>

  <!-- Lista de livros -->
  <div class="book-list">
    <div class="book-item" *ngFor="let livro of livrosFiltrados">
      <img [src]="livro.capa" [alt]="livro.titulo" class="book-cover" />
      <div class="book-info">
        <h3 class="book-title">{{ livro.titulo }}</h3>
        <p class="book-author">{{ livro.autor }}</p>
        <span class="book-status" [class]="livro.status">
          {{ livro.status === 'lendo' ? '📖 Lendo' : livro.status === 'lido' ? '✅ Lido' : '📕 Não lido' }}
        </span>
      </div>
      <div class="book-progress" *ngIf="livro.progresso">
        <div class="progress-bar">
          <div class="progress-fill" [style.width.%]="livro.progresso"></div>
        </div>
        <span>{{ livro.progresso }}%</span>
      </div>
      <span class="book-stars" *ngIf="livro.estrelas">⭐ {{ livro.estrelas }}</span>
    </div>
  </div>

  <!-- Botão adicionar (final da lista) -->
  <button class="btn-add-full">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="12" y1="5" x2="12" y2="19"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
    Adicionar novo livro
  </button>
</section>
